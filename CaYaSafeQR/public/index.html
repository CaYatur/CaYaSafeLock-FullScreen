<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anket Uygulaması</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Anket Uygulamasına Hoş Geldiniz</h1>
    <form id="anketForm">
        <input type="text" id="anketKod" placeholder="Anket Kodu" required>
        <button type="submit">Ankete Katıl</button>
    </form>
    <script>
        document.getElementById('anketForm').onsubmit = function (e) {
            e.preventDefault();
            const kod = document.getElementById('anketKod').value;
            window.location.href = `/${kod}`;
        };
    </script>
</body>
</html>
